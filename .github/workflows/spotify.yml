name: Build Spotify Connect plugin
on:
  push:
    paths: ['plugins/spotify/**', 'plugins/internal/**', '.github/workflows/spotify.yml']
  pull_request:
    paths: ['plugins/spotify/**', 'plugins/internal/**', '.github/workflows/spotify.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.5'
          cache: true
      - name: Install zig and cargo-zigbuild
        run: |
          python3 -m pip install --user ziglang==0.15.1
          cargo install cargo-zigbuild --version 0.23.4 --locked
      - name: Build librespot for aarch64 musl
        run: bash plugins/spotify/build-receiver.sh
      - run: go test -tags spotify ./plugins/spotify/... ./plugins/internal/...
      - name: Package and validate the plugin
        run: |
          python3 plugins/spotify/build-plugin.py
          go run ./cmd/alice-homebrew check release/spotify-connect-*.aliceplugin
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: spotify-connect-plugin
          path: |
            release/spotify-connect-*.aliceplugin
            plugins/spotify/licenses/
          if-no-files-found: error
